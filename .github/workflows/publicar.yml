# Publica el dashboard en GitHub Pages con los datos frescos de la hoja.
# La URL de la hoja vive solo en el secreto SHEET_URL: nunca llega al sitio ni al repositorio.
# Quién lo arranca: cron-job.org (una sola tarea, cada 30 minutos en punto y a la media, vía workflow_dispatch) es el disparador
# principal. El schedule de abajo es el refuerzo propio de GitHub: también cada 30 minutos, todo el día, desfasado 15 minutos;
# si uno de los dos falla, el otro publica. GitHub puede retrasar su schedule bajo carga y lo pausa tras 60 días sin commits.
# Autor: Kevin Alexis Barrera Llerena 2026
name: Publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

# Cada job declara solo los permisos que usa; el de nivel de flujo es el mínimo para cualquier job nuevo.
permissions:
  contents: read

# La concurrencia de Pages vive solo en el despliegue: así la limpieza corre siempre, aunque otra ejecución esté trabada.
jobs:
  destrabar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/destrabar-publicacion.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cancelar ejecuciones trabadas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/destrabar-publicacion.mjs

  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pruebas (solo cuando cambia el código)
        if: github.event_name == 'push'
        run: node --test "test/**/*.test.mjs"

      - name: Construir datos desde la hoja
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: node tools/construir-datos.mjs sitio/datos/datos.json

      - name: Armar el sitio (solo archivos públicos)
        run: |
          mkdir -p sitio
          cp index.html sitio/
          cp -r css src assets sitio/
          cp -r assets/personas sitio/assets/
          touch sitio/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio
          include-hidden-files: true

  desplegar:
    needs: [construir, destrabar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
