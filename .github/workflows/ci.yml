# Valida un cambio antes de publicarlo: corre todas las pruebas y el constructor con el libro de prueba, sin leer la
# hoja ni desplegar.
# Se ejecuta en pull requests y a mano; en main las pruebas ya corren dentro de la publicación.
# Autor: Kevin Alexis Barrera Llerena 2026
name: Validar cambios

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pruebas
        run: node --test "test/**/*.test.mjs"

      - name: Construir datos con el libro de prueba (humo del constructor)
        run: npm run datos

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Librerías de las pruebas de Python
        run: pip install openpyxl xlsxwriter

      - name: Prueba del generador del Excel
        run: python test/excel/plantilla.test.py

      - name: Prueba del oráculo
        run: python test/tools/oraculo.test.py

      - name: Oráculo independiente con los dos formatos
        run: npm run oraculo
